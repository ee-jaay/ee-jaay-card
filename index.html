<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="EE JAAY — James Kuyebi's digital business card. Dream. Plan. Build.">
  <title>EE JAAY | James Kuyebi</title>
  <style>
    :root { --gold:#d9ad45; --gold-light:#f5d77e; --bg:#080808; --panel:#111; --muted:#c7c0ae; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; color:#f7f1df; background:
      radial-gradient(ellipse at 50% -10%, #30240c 0, transparent 45%), var(--bg);
      font-family:Arial, Helvetica, sans-serif; display:flex; align-items:center; justify-content:center;
      padding:24px;
    }
    .card { width:min(100%, 470px); border:1px solid #6e5420; border-radius:22px; overflow:hidden;
      background:linear-gradient(145deg,#151515,#080808 65%); box-shadow:0 22px 70px #000; position:relative; }
    .accent { height:5px; background:linear-gradient(90deg,#765214,var(--gold-light),#9b6e19); }
    .inner { padding:32px 26px 28px; }
    .monogram { width:84px;height:84px;margin:0 auto 12px;border:1px solid var(--gold);transform:rotate(45deg);
      display:grid;place-items:center; }
    .monogram span { transform:rotate(-45deg);font-family:Georgia,serif;font-size:31px;font-weight:bold;color:var(--gold-light); }
    h1 { text-align:center; margin:18px 0 4px; font-family:Georgia,serif; letter-spacing:.28em;
      font-size:clamp(24px,7vw,32px); color:var(--gold-light); }
    .tagline { text-align:center; letter-spacing:.22em; text-transform:uppercase; color:var(--gold); font-size:11px; margin:12px 0 26px; }
    .rule { height:1px;background:linear-gradient(90deg,transparent,#a57b25,transparent); margin:24px 0; }
    h2 { margin:0 0 5px; font-family:Georgia,serif; font-size:25px; font-weight:normal; letter-spacing:.06em; }
    .brand { color:var(--gold); letter-spacing:.2em; font-size:12px; margin:0 0 22px; }
    .links { display:grid; gap:12px; }
    .link { display:flex;align-items:center;gap:12px;text-decoration:none;color:#f7f1df;padding:13px 14px;
      background:#151515;border:1px solid #292317;border-radius:12px;overflow-wrap:anywhere; }
    .link:focus,.link:hover { border-color:var(--gold); }
    .icon { color:var(--gold-light);width:22px;text-align:center;font-size:18px;flex:none; }
    .actions { display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px; }
    .btn { display:block;text-align:center;text-decoration:none;padding:13px 10px;border-radius:10px;
      font-size:13px;font-weight:bold;letter-spacing:.03em;border:1px solid var(--gold); }
    .primary { background:linear-gradient(135deg,var(--gold-light),#b7811c);color:#171006; }
    .secondary { color:var(--gold-light);background:transparent; }
    .foot { text-align:center;color:#8e8777;font-size:10px;letter-spacing:.16em;margin-top:25px; }
    @media (max-width:360px) { .inner{padding:26px 18px}.actions{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <main class="card">
    <div class="accent"></div>
    <div class="inner">
      <div class="monogram" aria-label="EJ monogram"><span>EJ</span></div>
      <h1>EE JAAY</h1>
      <p class="tagline">DREAM / PLAN / BUILD</p>
      <div class="rule"></div>
      <h2>James Kuyebi</h2>
      <p class="brand">EE JAAY</p>
      <div class="links">
        <a class="link" href="tel:+254746794101"><span class="icon">☎</span><span>+254 746 794 101</span></a>
        <a class="link" href="mailto:jkuyebi@gmail.com"><span class="icon">✉</span><span>jkuyebi@gmail.com</span></a>
        <a class="link" href="https://www.instagram.com/ee_jaay6/" target="_blank" rel="noopener noreferrer"><span class="icon">◎</span><span>@ee_jaay6 on Instagram</span></a>
      </div>
      <div class="actions">
        <a class="btn primary" href="contact.vcf" download>Save Contact</a>
        <a class="btn secondary" href="https://www.instagram.com/ee_jaay6/" target="_blank" rel="noopener noreferrer">View Instagram</a>
      </div>
      <div class="rule"></div>
      <p class="tagline" style="margin-bottom:0">SAME VISION / BIGGER MOVES</p>
      <p class="foot">EE JAAY · DIGITAL BUSINESS CARD</p>
    </div>
  </main>
</body>
</html>
